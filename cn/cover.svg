<text x="722" y="600" text-anchor="middle" font-size="13" fill="#f4b860">上班</text>

<rect x="92" y="660" width="616" height="215" rx="18" fill="#1c2239" stroke="#e8c88a" opacity=".96"/>
<text x="400" y="730" text-anchor="middle" font-size="25" fill="#fbf8f0">不是把火車從他手裡拿走，</text>
<text x="400" y="782" text-anchor="middle" font-size="25" fill="#fbf8f0">而是讓火車</text>
<text x="400" y="832" text-anchor="middle" font-size="30" font-weight="700" fill="#f4b860">載他去上班。</text>

