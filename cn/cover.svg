<text x="400" y="168" text-anchor="middle" font-size="76" font-weight="800" letter-spacing="10" fill="#f4b860">慢車到站</text>
<text x="400" y="214" text-anchor="middle" font-size="24" letter-spacing="3" fill="#d8dfef">The Slow Train Arrives</text>
<path d="M150 244 H650" stroke="#f4b860" opacity=".6"/>
<text x="400" y="286" text-anchor="middle" font-size="19" fill="#9aa2b7">把固著變成技能 —— 從神經地基到成人職場的四年培育藍圖</text>

<g filter="url(#陰影)"><rect x="60" y="322" width="215" height="104" rx="12" fill="#1c2239" stroke="#2f5d7a" stroke-width="2"/></g>
<text x="167.5" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#fbf8f0">神經控制力</text>
<text x="167.5" y="386" text-anchor="middle" font-size="14" fill="#9aa2b7">把生氣換成「等一下」</text>
<g filter="url(#陰影)"><rect x="292" y="322" width="216" height="104" rx="12" fill="#1c2239" stroke="#f4b860" stroke-width="2"/></g>
<text x="400" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#f4b860">工作記憶鏈</text>
<text x="400" y="386" text-anchor="middle" font-size="14" fill="#9aa2b7">一句話裝得下兩件事</text>
<g filter="url(#陰影)"><rect x="525" y="322" width="215" height="104" rx="12" fill="#1c2239" stroke="#2f8a5b" stroke-width="2"/></g>
<text x="632.5" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#fbf8f0">固著功能化</text>
<text x="632.5" y="386" text-anchor="middle" font-size="14" fill="#9aa2b7">最愛的事變成本事</text>

