<g text-anchor="middle" font-size="16" font-weight="700">
<text x="128" y="140" fill="#2f5d7a">S1 奠基期</text><text x="268" y="140" fill="#2f5d7a">S2 转化期</text>
<text x="408" y="140" fill="#9a6a1a">S3 职业探索</text><text x="548" y="140" fill="#9a6a1a">S4 职场耐受</text>
<text x="688" y="140" fill="#2f8a5b">S5 实习期</text><text x="846" y="140" fill="#2f8a5b">S6 转衔期</text>
</g>
<g text-anchor="middle" font-size="12.5" fill="#5a6378">
<text x="128" y="166">国三上</text><text x="268" y="166">国三下</text><text x="408" y="166">高职一</text>
<text x="548" y="166">高职二</text><text x="688" y="166">高职三上</text><text x="846" y="166">高职三下～毕业后</text>
<text x="128" y="182">主核心 C1</text><text x="268" y="182">主核心 C2</text><text x="408" y="182">C1＋C3</text>
<text x="548" y="182">主核心 C1</text><text x="688" y="182">C2＋C1</text><text x="846" y="182">维持与防退化</text>
</g>

<g text-anchor="middle" font-size="12.5" fill="#1d2230">
<text x="128" y="258">三格检核卡</text><text x="128" y="278">视觉计时器</text>
<text x="268" y="258">双层指令</text><text x="268" y="278">票价与纸钞</text>
<text x="408" y="258">多种工具</text><text x="408" y="278">职称与台词</text>
<text x="548" y="258">计数器</text><text x="548" y="278">抗干扰</text>
<text x="688" y="258">路线与地图</text><text x="688" y="278">陌生主管</text>
<text x="846" y="258">交接手册</text><text x="846" y="278">朝九晚五</text>
</g>

<rect x="62" y="310" width="868" height="86" rx="12" fill="#14182a"/>
<text x="496" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="#f4b860">阶段对应的是「能力」，不是「年级」</text>
<text x="496" y="372" text-anchor="middle" font-size="13.5" fill="#e7ecf7">高二才开始 → 一样先补 S1；已毕业在家 → S1 与成人作息同时做。用快筛定位，不用年级。</text>

<rect x="62" y="418" width="278" height="170" rx="12" fill="#eef5f7" stroke="#bcd6df"/>
<text x="84" y="448" font-size="15" font-weight="700" fill="#2f5d7a">转站要过三道门</text>
<text x="84" y="478" font-size="13.5" fill="#1d2230">① 能力门：离站标准连续两周</text>
<text x="84" y="504" font-size="13.5" fill="#1d2230">② 地基门：五块地基没亮红灯</text>
<text x="84" y="530" font-size="13.5" fill="#1d2230">③ 照顾者门：自检未达 3 项</text>
<text x="84" y="562" font-size="13" fill="#9a3b2f">任一道没过 → 留站</text>

<rect x="358" y="418" width="278" height="170" rx="12" fill="#fdf3e3" stroke="#e8c88a"/>
<text x="380" y="448" font-size="15" font-weight="700" fill="#9a6a1a">卡住的三种读法</text>
<text x="380" y="478" font-size="13.5" fill="#1d2230">能力卡 → 降一阶，重拿成功经验</text>
<text x="380" y="504" font-size="13.5" fill="#1d2230">动机卡 → 回 C3 换外壳</text>
<text x="380" y="530" font-size="13.5" fill="#1d2230">地基卡 → 停止推进，查第 11 章</text>
<text x="380" y="562" font-size="13" fill="#9a3b2f">倒退＝医疗事件，当天就医</text>

<rect x="654" y="418" width="276" height="170" rx="12" fill="#eef7f0" stroke="#2f8a5b"/>
<text x="676" y="448" font-size="15" font-weight="700" fill="#2f8a5b">留站不是失败</text>
<text x="676" y="478" font-size="13.5" fill="#1d2230">四年跑完六站是理想值，</text>
<text x="676" y="504" font-size="13.5" fill="#1d2230">不是及格线。</text>
<text x="676" y="536" font-size="13.5" fill="#1d2230">机构评估看的是稳定度，</text>
<text x="676" y="562" font-size="13.5" fill="#1d2230">不是你上过几课。</text>

<text x="950" y="622" text-anchor="end" font-size="11" fill="#5a6378">慢车到站 · The Slow Train Arrives</text></g></svg>
