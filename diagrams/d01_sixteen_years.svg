<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
<defs><marker id="箭頭" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2f5d7a"/></marker><marker id="金箭頭" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9a6a1a"/></marker><filter id="陰影" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14182a" flood-opacity=".13"/></filter></defs>
<rect width="1000" height="640" fill="#fbf8f0"/>
<g font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#1d2230">
<text x="50" y="55" font-size="28" font-weight="700">十六年病史時間軸與四年轉銜窗口</text>
<path d="M50 72 H950" stroke="#f4b860" stroke-width="3"/>

<rect x="700" y="120" width="250" height="330" rx="14" fill="#fdf3e3" stroke="#e8c88a" stroke-width="2"/>
<text x="825" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#9a6a1a">四年轉銜窗口</text>

<path d="M60 300 H930" stroke="#5a6378" stroke-width="4"/>
<g stroke="#c9c3b4" stroke-width="2">
<path d="M110 292 V308"/><path d="M255 292 V308"/><path d="M400 292 V308"/><path d="M620 292 V308"/><path d="M760 292 V308"/><path d="M900 292 V308"/>
</g>
<g font-size="13" fill="#5a6378" text-anchor="middle">
<text x="110" y="330">0 歲</text><text x="255" y="330">1–3 歲</text><text x="400" y="330">3–5 歲</text><text x="620" y="330">5–15 歲</text><text x="760" y="330">16 歲</text><text x="900" y="330">20 歲</text>
</g>

<g filter="url(#陰影)"><rect x="52" y="170" width="150" height="96" rx="11" fill="#eef5f7" stroke="#bcd6df" stroke-width="2"/></g>
<text x="127" y="199" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2230">低反應期</text>
<text x="127" y="222" text-anchor="middle" font-size="12.5" fill="#5a6378">安靜、不哭鬧</text>
<text x="127" y="243" text-anchor="middle" font-size="12.5" fill="#5a6378">感覺閾值偏高</text>

<g filter="url(#陰影)"><rect x="212" y="170" width="150" height="96" rx="11" fill="#eef5f7" stroke="#bcd6df" stroke-width="2"/></g>
<text x="287" y="199" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2230">語言未起步</text>
<text x="287" y="222" text-anchor="middle" font-size="12.5" fill="#5a6378">少指物、少共享</text>
<text x="287" y="243" text-anchor="middle" font-size="12.5" fill="#5a6378">「大隻雞慢啼」</text>

<g filter="url(#陰影)"><rect x="372" y="158" width="170" height="120" rx="11" fill="#faf0ee" stroke="#9a3b2f" stroke-width="2.5"/></g>
<text x="457" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3b2f">分水嶺</text>
<text x="457" y="211" text-anchor="middle" font-size="12.5" fill="#5a6378">疫苗 → 發燒 → 抽搐</text>
<text x="457" y="232" text-anchor="middle" font-size="12.5" fill="#5a6378">開始服用抗癲癇藥</text>
<text x="457" y="253" text-anchor="middle" font-size="12.5" fill="#5a6378">語言停滯</text>

<g filter="url(#陰影)"><rect x="552" y="158" width="170" height="120" rx="11" fill="#eef7f0" stroke="#2f8a5b" stroke-width="2"/></g>
<text x="637" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#2f8a5b">穩定與累積</text>
<text x="637" y="211" text-anchor="middle" font-size="12.5" fill="#5a6378">發作受控、自理獨立</text>
<text x="637" y="232" text-anchor="middle" font-size="12.5" fill="#5a6378">成為班上小幫手</text>
<text x="637" y="253" text-anchor="middle" font-size="12.5" fill="#5a6378">固著興趣成形</text>

<g filter="url(#陰影)"><rect x="732" y="170" width="190" height="96" rx="11" fill="#fdf3e3" stroke="#e8c88a" stroke-width="2"/></g>
<text x="827" y="199" text-anchor="middle" font-size="15" font-weight="700" fill="#9a6a1a">此刻：十六歲</text>
<text x="827" y="222" text-anchor="middle" font-size="12.5" fill="#5a6378">自理獨立、可簡單溝通</text>
<text x="827" y="243" text-anchor="middle" font-size="12.5" fill="#5a6378">生氣但勉強可控</text>

<path d="M760 360 L900 360" fill="none" stroke="#9a6a1a" stroke-width="3" marker-end="url(#金箭頭)"/>
<text x="825" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6a1a">奠基 → 轉化 → 探索</text>
<text x="825" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6a1a">耐受 → 實習 → 轉銜</text>
<text x="825" y="437" text-anchor="middle" font-size="12.5" fill="#5a6378">畢業後：小作所／日照／庇護</text>

<rect x="52" y="470" width="620" height="120" rx="12" fill="#eef5f7" stroke="#bcd6df"/>
<text x="72" y="500" font-size="15" font-weight="700" fill="#2f5d7a">讀這條時間軸的三個重點</text>
<text x="72" y="527" font-size="13.5" fill="#1d2230">① 起點不在三歲那一針，而在嬰兒期的「不哭鬧」——那是最早的線索。</text>
<text x="72" y="551" font-size="13.5" fill="#1d2230">② 中段十年不是空白：自理與人緣是這段時間累積出來的資產。</text>
<text x="72" y="575" font-size="13.5" fill="#1d2230">③ 右邊那格是唯一還能動的部分，而它有明確的截止日。</text>

<text x="950" y="620" text-anchor="end" font-size="11" fill="#5a6378">慢車到站 · The Slow Train Arrives</text></g></svg>
