<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
<defs><marker id="箭頭" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a3b2f"/></marker><filter id="陰影" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14182a" flood-opacity=".13"/></filter></defs>
<rect width="1000" height="640" fill="#fbf8f0"/>
<g font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#1d2230">
<text x="50" y="55" font-size="28" font-weight="700">五塊神經地基：訓練失效時，由下往上排查</text>
<path d="M50 72 H950" stroke="#f4b860" stroke-width="3"/>

<g filter="url(#陰影)">
<rect x="120" y="110" width="560" height="66" rx="10" fill="#fdf3e3" stroke="#e8c88a" stroke-width="2"/>
<rect x="120" y="186" width="560" height="66" rx="10" fill="#eef5f7" stroke="#bcd6df" stroke-width="2"/>
<rect x="120" y="262" width="560" height="66" rx="10" fill="#eef5f7" stroke="#bcd6df" stroke-width="2"/>
<rect x="120" y="338" width="560" height="66" rx="10" fill="#eef7f0" stroke="#2f8a5b" stroke-width="2"/>
<rect x="120" y="414" width="560" height="66" rx="10" fill="#faf0ee" stroke="#9a3b2f" stroke-width="2.5"/>
</g>
<text x="146" y="152" font-size="17" font-weight="700" fill="#9a6a1a">⑤ 照顧者狀態</text>
<text x="400" y="152" font-size="13.5" fill="#5a6378">規則開始鬆動、記錄中斷、家庭衝突升高</text>
<text x="146" y="228" font-size="17" font-weight="700" fill="#2f5d7a">④ 腸道與代謝</text>
<text x="400" y="228" font-size="13.5" fill="#5a6378">腹脹、食慾差、坐不住、煩躁</text>
<text x="146" y="304" font-size="17" font-weight="700" fill="#2f5d7a">③ 飲食與血糖</text>
<text x="400" y="304" font-size="13.5" fill="#5a6378">下午時段特別差、體重異常變化</text>
<text x="146" y="380" font-size="17" font-weight="700" fill="#2f8a5b">② 睡眠</text>
<text x="400" y="380" font-size="13.5" fill="#5a6378">情緒回復時間拉長、專注斷裂、易怒</text>
<text x="146" y="456" font-size="17" font-weight="700" fill="#9a3b2f">① 放電與用藥</text>
<text x="400" y="456" font-size="13.5" fill="#5a6378">全面退步、學過的東西不見、異常嗜睡或暴躁</text>

<path d="M90 470 L90 130" fill="none" stroke="#9a3b2f" stroke-width="3" marker-end="url(#箭頭)"/>
<text x="72" y="500" font-size="13" fill="#9a3b2f">排查方向</text>

<rect x="120" y="500" width="560" height="60" rx="10" fill="#14182a"/>
<text x="400" y="537" text-anchor="middle" font-size="15" font-weight="700" fill="#f4b860">五塊都查過，才輪到「方法、強度、動機」</text>

<rect x="705" y="110" width="235" height="212" rx="12" fill="#eef5f7" stroke="#bcd6df"/>
<text x="822" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5d7a">回診要講的四段</text>
<text x="725" y="176" font-size="13.5" fill="#1d2230">1. 發作紀錄（型態／頻率）</text>
<text x="725" y="204" font-size="13.5" fill="#1d2230">2. 「像發作但不確定」的事件</text>
<text x="725" y="232" font-size="13.5" fill="#9a3b2f">3. 認知與行為的變化 ★</text>
<text x="725" y="260" font-size="13.5" fill="#1d2230">4. 疑似藥物不良反應</text>
<path d="M725 278 H920" stroke="#bcd6df"/>
<text x="725" y="302" font-size="12.5" fill="#5a6378">退步跡象 → 問睡眠腦電圖</text>

<rect x="705" y="338" width="235" height="222" rx="12" fill="#faf0ee" stroke="#9a3b2f"/>
<text x="822" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3b2f">做對的事，用對的理由</text>
<text x="725" y="402" font-size="13" fill="#1d2230">「便秘 → 血氨 → 癲癇」</text>
<text x="725" y="426" font-size="13" fill="#1d2230">這條因果鏈並不成立。</text>
<path d="M725 442 H920" stroke="#9a3b2f" opacity=".3"/>
<text x="725" y="468" font-size="13" fill="#1d2230">該監測血氨的理由來自</text>
<text x="725" y="492" font-size="13" fill="#9a3b2f">藥物本身，不是來自便秘。</text>
<text x="725" y="524" font-size="12.5" fill="#5a6378">用錯的理由做對的事，</text>
<text x="725" y="546" font-size="12.5" fill="#5a6378">下次會用同樣的推理做錯事。</text>

<text x="950" y="622" text-anchor="end" font-size="11" fill="#5a6378">慢車到站 · The Slow Train Arrives</text></g></svg>
