<rect width="1000" height="640" fill="#fbf8f0"/>
<g font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#1d2230">
<text x="50" y="55" font-size="28" font-weight="700">四年時間軸：六站，一站一站開</text>
<path d="M50 72 H950" stroke="#f4b860" stroke-width="3"/>

<path d="M70 210 H930" stroke="#5a6378" stroke-width="4"/>
<path d="M70 224 H930" stroke="#5a6378" stroke-width="4"/>
<g stroke="#c9c3b4" stroke-width="2.5">
<path d="M100 204 V230"/><path d="M240 204 V230"/><path d="M380 204 V230"/><path d="M520 204 V230"/><path d="M660 204 V230"/><path d="M800 204 V230"/><path d="M920 204 V230"/>
</g>

