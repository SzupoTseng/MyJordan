<rect x="62" y="112" width="132" height="76" rx="10" fill="#eef5f7" stroke="#2f5d7a" stroke-width="2"/>
<rect x="202" y="112" width="132" height="76" rx="10" fill="#eef5f7" stroke="#2f5d7a" stroke-width="2"/>
