<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
<defs><marker id="箭頭" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2f5d7a"/></marker><marker id="紅箭頭" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9a3b2f"/></marker><filter id="陰影" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14182a" flood-opacity=".13"/></filter></defs>
<rect width="1000" height="640" fill="#fbf8f0"/>
<g font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#1d2230">
<text x="50" y="55" font-size="28" font-weight="700">離站判定：一個標準的四個要件，與三道門</text>
<path d="M50 72 H950" stroke="#f4b860" stroke-width="3"/>

<rect x="60" y="105" width="880" height="118" rx="12" fill="#14182a"/>
<text x="86" y="138" font-size="16" font-weight="700" fill="#f4b860">一個完整的標準必須同時有四件事</text>
<g font-size="13.5" fill="#e7ecf7">
<text x="86" y="168">① 明確的行為（看得見的動作）　② 數量門檻（比率或次數）</text>
<text x="86" y="194">③ 時間窗口（連續兩週）　　　　④ 場域條件（在幾個場合成立）</text>
</g>
<text x="620" y="168" font-size="13" fill="#9aa2b7">✗「能獨立完成任務」</text>
<text x="620" y="194" font-size="13" fill="#f4b860">✓「看卡無提示完成 2 項，≥70%，連兩週，家＋學校」</text>

<g filter="url(#陰影)"><rect x="60" y="255" width="270" height="130" rx="12" fill="#eef5f7" stroke="#2f5d7a" stroke-width="2"/></g>
<text x="195" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5d7a">門 1　能力門</text>
<text x="195" y="316" text-anchor="middle" font-size="13.5" fill="#1d2230">查離站標準總表</text>
<text x="195" y="340" text-anchor="middle" font-size="13.5" fill="#1d2230">所有項目達標</text>
<text x="195" y="366" text-anchor="middle" font-size="13" fill="#5a6378">且「連續兩週」成立</text>

<g filter="url(#陰影)"><rect x="365" y="255" width="270" height="130" rx="12" fill="#fdf3e3" stroke="#e8c88a" stroke-width="2"/></g>
<text x="500" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#9a6a1a">門 2　地基門</text>
<text x="500" y="316" text-anchor="middle" font-size="13.5" fill="#1d2230">睡眠穩定、無用藥調整中</text>
<text x="500" y="340" text-anchor="middle" font-size="13.5" fill="#1d2230">無重大環境變動</text>
<text x="500" y="366" text-anchor="middle" font-size="13" fill="#9a3b2f">無任何技能倒退跡象</text>

<g filter="url(#陰影)"><rect x="670" y="255" width="270" height="130" rx="12" fill="#eef7f0" stroke="#2f8a5b" stroke-width="2"/></g>
<text x="805" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#2f8a5b">門 3　照顧者門</text>
<text x="805" y="316" text-anchor="middle" font-size="13.5" fill="#1d2230">自檢未達 3 項</text>
<text x="805" y="340" text-anchor="middle" font-size="13.5" fill="#1d2230">兩位大人有共識</text>
<text x="805" y="366" text-anchor="middle" font-size="13" fill="#5a6378">看紀錄，不看印象</text>

<path d="M332 320 L363 320" fill="none" stroke="#2f5d7a" stroke-width="3" marker-end="url(#箭頭)"/>
<path d="M637 320 L668 320" fill="none" stroke="#2f5d7a" stroke-width="3" marker-end="url(#箭頭)"/>
<path d="M500 388 L500 420" fill="none" stroke="#9a3b2f" stroke-width="3" marker-end="url(#紅箭頭)"/>
<text x="520" y="412" font-size="13" fill="#9a3b2f">任一道沒過 → 留站</text>

<rect x="60" y="432" width="430" height="158" rx="12" fill="#faf0ee" stroke="#9a3b2f" stroke-width="2"/>
<text x="82" y="462" font-size="16" font-weight="700" fill="#9a3b2f">六種常見的假達標</text>
<g font-size="13" fill="#1d2230">
<text x="82" y="490">① 只在最好的日子測　② 大人不自覺地提示</text>
<text x="82" y="514">③ 只在同一個任務上達標　④ 只在同一個人面前達標</text>
<text x="82" y="538">⑤ 把「有做到」當成「穩定做到」</text>
<text x="82" y="562">⑥ 為了進度而放寬標準 ← 會在下一站以更大代價回來</text>
</g>

<rect x="510" y="432" width="430" height="158" rx="12" fill="#eef5f7" stroke="#bcd6df"/>
<text x="532" y="462" font-size="16" font-weight="700" fill="#2f5d7a">大人判定不一致時</text>
<g font-size="13" fill="#1d2230">
<text x="532" y="490">「在家可以、在學校不行」不是誰對誰錯，</text>
<text x="532" y="514">是「尚未類化」——沒過場域要求。</text>
<text x="532" y="538">處置：在學校補做同一級，不是爭論。</text>
<text x="532" y="562">仍僵持 → 留站。錯誤升階的成本高得多。</text>
</g>

<text x="950" y="622" text-anchor="end" font-size="11" fill="#5a6378">慢車到站 · The Slow Train Arrives</text></g></svg>
