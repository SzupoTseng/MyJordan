<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
<defs><marker id="箭頭" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2f8a5b"/></marker><filter id="陰影" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14182a" flood-opacity=".13"/></filter></defs>
<rect width="1000" height="640" fill="#fbf8f0"/>
<g font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif" fill="#1d2230">
<text x="50" y="55" font-size="28" font-weight="700">職業實作評估：五個地雷，四個技巧</text>
<path d="M50 72 H950" stroke="#f4b860" stroke-width="3"/>

<g filter="url(#陰影)"><rect x="50" y="100" width="430" height="290" rx="14" fill="#faf0ee" stroke="#9a3b2f" stroke-width="2.5"/></g>
<text x="265" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3b2f">五大扣分地雷</text>
<text x="72" y="172" font-size="14" font-weight="700">① 中途停頓、眼神渙散</text>
<text x="72" y="194" font-size="12.5" fill="#5a6378">扣「工作持續力」</text>
<text x="72" y="224" font-size="14" font-weight="700">② 物件不對齊、隨意擺放</text>
<text x="72" y="246" font-size="12.5" fill="#5a6378">扣「操作良率」</text>
<text x="72" y="276" font-size="14" font-weight="700">③ 指令沒做完就起身</text>
<text x="72" y="298" font-size="12.5" fill="#5a6378">扣「指令完整度」——完工訊號提早釋放</text>
<text x="72" y="328" font-size="14" font-weight="700" fill="#9a3b2f">④ 被打斷時跺腳、僵住　★ 影響最大</text>
<text x="72" y="350" font-size="12.5" fill="#5a6378">扣「情緒控制」，可能被歸為行為風險</text>
<text x="72" y="376" font-size="14" font-weight="700">⑤ 工具沒歸位就離場</text>

<g filter="url(#陰影)"><rect x="520" y="100" width="430" height="290" rx="14" fill="#eef7f0" stroke="#2f8a5b" stroke-width="2.5"/></g>
<text x="735" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#2f8a5b">四大應考技巧</text>
<text x="542" y="172" font-size="14" font-weight="700">① 眼神對齊 ＋ 覆誦</text>
<text x="542" y="194" font-size="12.5" fill="#5a6378">「好，藍色籃子。」→ 破地雷 ①③</text>
<text x="542" y="224" font-size="14" font-weight="700" fill="#2f8a5b">② 定格站姿 ＋ 制式台詞　★ 最重要</text>
<text x="542" y="246" font-size="12.5" fill="#5a6378">「請老師指導我，謝謝。」→ 破地雷 ①④</text>
<text x="542" y="276" font-size="14" font-weight="700">③ 成品對齊 ＋ 主動回報</text>
<text x="542" y="298" font-size="12.5" fill="#5a6378">「報告老師，我做好了，請檢查。」→ 破 ②</text>
<text x="542" y="328" font-size="14" font-weight="700">④ 工具 100% 歸位才離場</text>
<text x="542" y="350" font-size="12.5" fill="#5a6378">「謝謝老師，老師再見。」→ 破 ⑤</text>
<text x="542" y="376" font-size="12.5" fill="#2f8a5b">委員最欣賞：會生氣、但能用語言配合調度</text>

<path d="M484 245 L516 245" fill="none" stroke="#2f8a5b" stroke-width="3" marker-end="url(#箭頭)"/>

<rect x="50" y="415" width="430" height="175" rx="12" fill="#eef5f7" stroke="#bcd6df"/>
<text x="72" y="447" font-size="16" font-weight="700" fill="#2f5d7a">為什麼考擰抹布</text>
<text x="72" y="477" font-size="13" fill="#1d2230">兩手同時往「相反方向」轉 —— 左右半球</text>
<text x="72" y="499" font-size="13" fill="#1d2230">要同時發出相反卻協調的指令。</text>
<text x="72" y="527" font-size="13" fill="#9a3b2f">看的不是擰得乾不乾，是兩手能不能各做各的。</text>
<text x="72" y="558" font-size="13" fill="#5a6378">對接：餐飲、清潔、汽車美容的日常動作</text>

<rect x="520" y="415" width="430" height="175" rx="12" fill="#fdf3e3" stroke="#e8c88a"/>
<text x="542" y="447" font-size="16" font-weight="700" fill="#9a6a1a">為什麼考拿剪刀</text>
<text x="542" y="477" font-size="13" fill="#1d2230">同一隻手上，一半在動、一半在穩定；</text>
<text x="542" y="499" font-size="13" fill="#1d2230">另一隻手還要同步轉紙。</text>
<text x="542" y="527" font-size="13" fill="#9a3b2f">剪刀精準度，預測未來手工代工的良率。</text>
<text x="542" y="558" font-size="13" fill="#5a6378">對接：剪線頭、裁包裝、撕貼標籤</text>

<text x="950" y="622" text-anchor="end" font-size="11" fill="#5a6378">慢車到站 · The Slow Train Arrives</text></g></svg>
