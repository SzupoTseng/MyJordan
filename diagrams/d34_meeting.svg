<text x="72" y="433" font-size="15" font-weight="700" fill="#9a3b2f">第一優先　安全與醫療</text>
<text x="420" y="433" font-size="13" fill="#1d2230">緊急處置流程 · 可以休息的授權 · 校外活動的支持人力</text>
<text x="102" y="484" font-size="15" font-weight="700" fill="#9a6a1a">第二優先　可評量目標</text>
<text x="420" y="484" font-size="13" fill="#1d2230">三項目標寫進 IEP · 檢核方式與回報頻率</text>
<text x="132" y="534" font-size="15" font-weight="700" fill="#2f5d7a">第三優先　教學策略</text>
<text x="420" y="534" font-size="13" fill="#1d2230">視覺檢核卡 · 交辦後覆誦 · 固著的一致處理</text>
<text x="162" y="584" font-size="15" font-weight="700" fill="#2f8a5b">第四優先　加值項目</text>
<text x="440" y="584" font-size="13" fill="#1d2230">實作課安排 · 社區適應 · 座位與分組</text>

<text x="950" y="628" text-anchor="end" font-size="11" fill="#5a6378">慢車到站 · The Slow Train Arrives</text></g></svg>
