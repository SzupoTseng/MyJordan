<text x="50" y="55" font-size="28" font-weight="700">會議桌上：三份文件，四層優先序</text>
<path d="M50 72 H950" stroke="#f4b860" stroke-width="3"/>

<g filter="url(#陰影)"><rect x="50" y="102" width="285" height="150" rx="12" fill="#eef5f7" stroke="#2f5d7a" stroke-width="2"/></g>
<text x="192" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5d7a">文件一　一頁摘要</text>
<text x="72" y="164" font-size="13" fill="#1d2230">現況三句 · 醫療三行</text>
<text x="72" y="188" font-size="13" fill="#1d2230">三個可評量目標</text>
<text x="72" y="212" font-size="13" fill="#1d2230">需要的支持 · 家庭端在做什麼</text>
<text x="72" y="236" font-size="13" fill="#1d2230">回報方式</text>

<g filter="url(#陰影)"><rect x="357" y="102" width="285" height="150" rx="12" fill="#fdf3e3" stroke="#e8c88a" stroke-width="2"/></g>
<text x="499" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#9a6a1a">文件二　能力證據</text>
<text x="379" y="164" font-size="13" fill="#1d2230">3–5 張照片或短片</text>
<text x="379" y="188" font-size="13" fill="#1d2230">做家事 · 用檢核卡</text>
<text x="379" y="212" font-size="13" fill="#1d2230">完成代工 · 超商結帳</text>
<text x="379" y="236" font-size="13" fill="#9a6a1a">證據勝過任何形容詞</text>

<g filter="url(#陰影)"><rect x="664" y="102" width="286" height="150" rx="12" fill="#eef7f0" stroke="#2f8a5b" stroke-width="2"/></g>
<text x="807" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#2f8a5b">文件三　給老師的備忘錄</text>
<text x="686" y="164" font-size="13" fill="#1d2230">醫療與安全 · 他學得最好的方式</text>
<text x="686" y="188" font-size="13" fill="#1d2230">固著行為的引導</text>
<text x="686" y="212" font-size="13" fill="#1d2230">他的三句話</text>
<text x="686" y="236" font-size="13" fill="#1d2230">家庭端正在做的事</text>

<rect x="50" y="282" width="900" height="96" rx="12" fill="#14182a"/>
<text x="500" y="314" text-anchor="middle" font-size="17" font-weight="700" fill="#f4b860">會議桌上唯一有效的語言：可評量的目標</text>
<text x="500" y="344" text-anchor="middle" font-size="13.5" fill="#9aa2b7">✗「請老師多關照」　　✗「提升專注力」</text>
<text x="500" y="368" text-anchor="middle" font-size="13.5" fill="#e7ecf7">✓「能持續在工作崗位操作 20 分鐘，中途不需口頭提醒，達成率 70%」</text>

